# Smart Thermostat Dashboard
#   cp .env.example .env   # then set HOST_IP to this machine's LAN IP
#   docker compose up -d --build
# UI:    http://<HOST_IP>:8890   (History tab = Grafana on port 3010)
# Login: http://<HOST_IP>:3001  (Amazon sign-in proxy; only listens until you've logged in)
# ./data/alexa-cookie.json holds your Amazon session. Treat it like a password.
# Never port-forward 8890 or 3001 on your router.

name: thermostat

services:
  thermostat:
    container_name: thermostat
    build: .
    image: smart-thermostat-dashboard:local
    restart: unless-stopped
    ports:
      - "8890:8890"
      - "3001:3001"
    environment:
      HOST_IP: "${HOST_IP:?Set HOST_IP in .env (copy .env.example)}"
      ALLOWED_HOSTS: "${HOST_IP},localhost,127.0.0.1${EXTRA_ALLOWED_HOSTS:+,}${EXTRA_ALLOWED_HOSTS:-}"
      POLL_SECONDS: "${POLL_SECONDS:-60}"
      DEBUG: "${DEBUG:-0}"
      TZ: "${TZ:-UTC}"
      GRAFANA_PORT: "${GRAFANA_PORT:-3010}"
    volumes:
      - ./data:/data
      - ${HISTORY_DIR:-./history}:/history
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Charts of the logged history. Anyone on your LAN can view (read-only); editing needs the admin login.
  grafana:
    container_name: thermostat-grafana
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    restart: unless-stopped
    # Install the SQLite datasource plugin (pinned) on first start, then run Grafana.
    entrypoint: ["sh", "-c", "[ -d /var/lib/grafana/plugins/frser-sqlite-datasource ] || grafana cli --pluginsDir /var/lib/grafana/plugins plugins install frser-sqlite-datasource 4.0.6; exec /run.sh"]
    user: "${UID_GID:-1000:1000}"
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    environment:
      TZ: "${TZ:-UTC}"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/thermostat.json
      # Skip Grafana's default extra plugins; the SQLite one is installed below.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-data:/var/lib/grafana
      # Read-write only because SQLite's WAL mode needs it; the datasource opens the file read-only.
      - ${HISTORY_DIR:-./history}:/history
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
